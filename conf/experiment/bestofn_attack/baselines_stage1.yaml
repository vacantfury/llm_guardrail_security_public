num_main_job_threads: 8
num_cluster_jobs: 1          # orchestrator only (non-LLM transforms, no vLLM server)

_c: &c
  source_file: data/harmbench_bon_100.jsonl
  prompt_range: [0, 9999]

tasks:
  - <<: *c
    mode: prompt_transform
    transformation_list:
      - type: non_llm_baseline        # (A) floor: raw harmful prompt, unchanged
        params: {}
  - <<: *c
    mode: prompt_transform
    transformation_list:
      - type: code_attack             # (B) single-best structural attack, alone (no bank)
        params: {}
