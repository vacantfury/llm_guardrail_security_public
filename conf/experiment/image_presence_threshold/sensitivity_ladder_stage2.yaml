
num_main_job_threads: 6
num_cluster_jobs: 1          # API targets + API judge — no vLLM server needed.

# Stage 1 (AICR job 287521, COMPLETED 26s, exit 0:0) verified 2026-08-06:
#   * 100/100 IDENTICAL text between the two arms of each rung -> keep_text held,
#     so the arms differ ONLY in image presence and the pairing is exact.
#   * text arm carries image_encoded=None; blank arm carries one image per prompt.
#   * 100 images per rung with exactly 1 DISTINCT md5 -> every prompt gets the
#     byte-identical blank canvas, i.e. literally zero per-prompt information in
#     the image channel. This is the isolation the whole claim rests on.
_r1_text:  &r1_text  outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_6183277/non_llm_baseline
_r1_blank: &r1_blank outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_6183277/ir_blank
_r2_text:  &r2_text  outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/non_llm_baseline
_r2_blank: &r2_blank outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/ir_blank

_b: &b
  mode: defense+evaluate
  defense: no_defense
  prompt_range: [0, 99]
  benchmark: jailbreakbench_benign   # pinned: hold the reporting path constant
  judge_method: jbb_refusal          # pinned: hold the INSTRUMENT constant across rungs
  judge_model: gpt-5-mini
  campaign: paper_b_sensitivity_ladder

tasks:
  # ================= RUNG 1 — neutral (AlpacaEval, filtered) =================
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r1_text}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r1_blank}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r1_text}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r1_blank}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r1_text}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r1_blank}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r1_text}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r1_blank}

  # ============ RUNG 2 — borderline-benign (OR-Bench hard) ============
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r2_text}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r2_blank}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r2_text}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r2_blank}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r2_text}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r2_blank}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r2_text}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r2_blank}
