
num_main_job_threads: 2

tasks:
  - mode: prompt_transform
    source_transform_subdir: outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/non_llm_baseline
    benchmark: jailbreakbench_benign
    prompt_range: [0, 99]
    campaign: paper_b_presence_controls
    transformation_list:
      - type: ir_constant
        # ⚠️ `params:` NESTING IS MANDATORY. This block previously wrote
        # `image_path:` as a SIBLING of `type:`, where TransformationSpec
        # silently dropped it — the 2026-08-07 run therefore rendered the
        # DEFAULT rabbit (1189x1418) and the paper labelled that arm "mountain"
        # for a day. TransformationSpec now sets extra="forbid" so the same typo
        # raises at startup instead of running the wrong image.
        params:
          # The mountain decoy the paper's Tab. refusal already uses, so the two
          # image classes are comparable to what is published.
          image_path: src/prompt_transformations/image/images/mountain.png
