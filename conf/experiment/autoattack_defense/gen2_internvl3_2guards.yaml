# Paper C — InternVL3-8B panel COMPLETION: the two guards the second target never got (2026-07-25).
#
# WHY. The 2026-07-21 gen2 run covered only 3 of the 5 guards on InternVL3 (wildguard, qwen3guard,
# guardreasoner_vl_7b); LlamaGuard-3 and ThinkGuard were never run there at all. That asymmetry is the
# one REAL data gap in the two-target panel -- it is why the Qwen-vs-InternVL3 head-to-head on the
# disputed gb->mc contrast compares 5 guards against 3. `src/analysis/paper_c_stats.py::coverage()`
# now prints these six arms as ARM ABSENT before every table; this preset closes them.
#
# 2 guards x 3 conditions (gb / mc / mc+reguard) x 11 attacks = 66 cells. Campaign name is deliberately
# the SAME as the original gen2 run so the existing analysis picks the cells up with no code change.
#
# COST. GPU only. Judge is wildguard (free, throwaway, cheap-first) -> gpt-5-mini rejudge afterwards for
# the reported numbers, exactly as the original gen2 run did. ~3.3 GPU-h, ~6.6k rejudge calls (~$5).
# Servers: internvl3 + llama_guard_3 + thinkguard + wildguard = 4 -> num_cluster_jobs 5.
num_main_job_threads: 4
num_cluster_jobs: 5
