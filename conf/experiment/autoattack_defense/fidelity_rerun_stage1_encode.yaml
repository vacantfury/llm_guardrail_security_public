
num_main_job_threads: 4
num_cluster_jobs: 1

tasks:
  # ── §1.1 CodeAttack · harmful axis (deterministic, no LLM) ──
  - mode: prompt_transform
    source_file: data/harmbench_prompts.jsonl
    prompt_range: [0, 99]
    transformation_list:
      - type: code_attack

  # ── §1.1 CodeAttack · benign axis (over-refusal) ──
  - mode: prompt_transform
    source_file: data/orbench_benign_hard_prompts.jsonl
    prompt_range: [0, 99]
    transformation_list:
      - type: code_attack

  # ── §1.3 FigStep · harmful axis (aux-LLM paraphrase → typographic render) ──
  - mode: prompt_transform
    source_file: data/harmbench_prompts.jsonl
    prompt_range: [0, 99]
    transformation_list:
      - type: ir_figstep
        params: {keep_text: false}

  # ── §1.3 FigStep · benign axis (over-refusal) ──
  - mode: prompt_transform
    source_file: data/orbench_benign_hard_prompts.jsonl
    prompt_range: [0, 99]
    transformation_list:
      - type: ir_figstep
        params: {keep_text: false}
