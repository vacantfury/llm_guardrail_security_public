
num_main_job_threads: 6
num_cluster_jobs: 6

_code: &code outputs/autoattack_defense/prompt_transform/harmbench/code_attack_20260805_215649_22270770/code_attack
_fig:  &fig  outputs/autoattack_defense/prompt_transform/harmbench/ir_figstep_20260805_215649_72871103/ir_figstep

_base: &base
  mode: defense+evaluate
  defense: modality_complete
  target_model: qwen2_5_vl_7b
  prompt_range: [0, 99]
  judge_model: gpt-5-mini
  campaign: paper_c_fidelity_rerun_nodecode

tasks:
  # ── Qwen3Guard-Gen-8B ──
  - {<<: *base, source_transform_subdir: *code, defense_config: {guard_model: qwen3guard_gen_8b, decode_text: false}}
  - {<<: *base, source_transform_subdir: *fig,  defense_config: {guard_model: qwen3guard_gen_8b, decode_text: false}}

  # ── ThinkGuard ──
  - {<<: *base, source_transform_subdir: *code, defense_config: {guard_model: thinkguard, decode_text: false}}
  - {<<: *base, source_transform_subdir: *fig,  defense_config: {guard_model: thinkguard, decode_text: false}}

  # ── LlamaGuard-3-8B ──
  - {<<: *base, source_transform_subdir: *code, defense_config: {guard_model: llama_guard_3_8b, decode_text: false}}
  - {<<: *base, source_transform_subdir: *fig,  defense_config: {guard_model: llama_guard_3_8b, decode_text: false}}

  # ── GuardReasoner-VL-7B (multimodal — this is why the text-cell identity fails here) ──
  - {<<: *base, source_transform_subdir: *code, defense_config: {guard_model: guardreasoner_vl_7b, decode_text: false}}
  - {<<: *base, source_transform_subdir: *fig,  defense_config: {guard_model: guardreasoner_vl_7b, decode_text: false}}
