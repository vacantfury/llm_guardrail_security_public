
num_main_job_threads: 4
num_cluster_jobs: 5

# ── shared range: n=100 reportable ──
_rng: &rng [0, 99]

# ── mc + REGUARD_ORIGINAL configs (layer 3) — the ONLY new condition ──
_mcwg_rg:   &mcwg_rg   {guard_model: wildguard,           decode_text: true, decode_style: recover, reguard_original: true}
_mcq3g_rg:  &mcq3g_rg  {guard_model: qwen3guard_gen_8b,   decode_text: true, decode_style: recover, reguard_original: true}
_mcgrvl_rg: &mcgrvl_rg {guard_model: guardreasoner_vl_7b, decode_text: true, decode_style: recover, reguard_original: true}

# in-run judges are THROWAWAY (gpt-5-mini rejudge the saved responses afterward)
_harm: &harm {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, judge_method: wildguard, judge_model: wildguard, campaign: paper_c_reguard_ablation}
_ben:  &ben  {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, benchmark: orbench_benign_hard, judge_method: orbench, judge_model: qwen2_5_vl_7b, campaign: paper_c_reguard_ablation}

# ── attack render dirs (11 attacks, all n=100 — identical to guard_panel.yaml) ──
_set: &set outputs/autoattack_defense/prompt_transform/harmbench/set_theory_20260531_055707_10045511/llm_set_theory
_flog: &flog outputs/autoattack_defense/prompt_transform/harmbench/formal_logic_20260531_055707_75502107/llm_formal_logic
_class: &class outputs/autoattack_defense/prompt_transform/harmbench/classical_chinese_simplified_ir_constant_20260710_002424_56524373/llm_classical_language
