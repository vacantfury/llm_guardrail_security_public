# ============================================================
# Paper C · Benign-refusal pilot — Stage 1: render JBB-benign prompts  (2026-07-17)
# ============================================================
# The COST side of the ensemble pilot: does modality_complete over-refuse BENIGN
# prompts delivered in the attack modality (image)? Renders JailbreakBench-benign
# through ir_plain (benign text in an image, keep_text=false — the same delivery
# the image attacks use) so the guard's recover+decode+guard runs on benign
# content. A plain-text benign baseline is included for the modality contrast.
# PILOT slice [0,19]; bump to [0,99] for the full run. Stage 1 only (no queries).
# ============================================================

num_main_job_threads: 4

tasks:
  # benign rendered to image (the over-refusal test for the guard)
  - mode: prompt_transform
    source_file: data/jbb_benign_prompts.jsonl
    prompt_range: [0, 19]
    benchmark: jailbreakbench_benign
    transformation_list:
      - type: ir_plain
        params: {keep_text: false}

  # benign plain text (baseline — refusal without the image modality)
  - mode: prompt_transform
    source_file: data/jbb_benign_prompts.jsonl
    prompt_range: [0, 19]
    benchmark: jailbreakbench_benign
    transformation_list:
      - type: non_llm_baseline     # plain passthrough (alias: plain)
