# ============================================================
# Paper C · RQ4 reguard ablation — WILDGUARD RE-RUN (2026-07-21)
# ============================================================
# Completes the reguard ablation: the wildguard cells failed in the first xc run
# (job 25) because xc had no HF token → wildguard's GATED repo returned 401. Fixed
# 2026-07-21: HF token wired into xc ~/.xc_env (from the maintainer's secret manager) +
# xc.yaml env_setup now sources it into server jobs. This re-runs ONLY wildguard's
# 13 cells (11 harmful + 2 benign); qwen3guard + guardreasoner (26 cells) already
# succeeded and are kept. SAME campaign (paper_c_reguard_ablation) so the ensemble
# analysis joins all three guards on prompt id.
#
# In-run judge = wildguard (throwaway, free) — but on this run wildguard IS the guard
# too, both from the same served endpoint; final ASR comes from the gpt-5-mini rejudge
# of saved responses (as for the other 26).
# SERVERS: qwen (target) + wildguard (guard) = 2 -> num_cluster_jobs = 3.
# ============================================================

num_main_job_threads: 2
num_cluster_jobs: 3

_rng: &rng [0, 99]

_mcwg_rg: &mcwg_rg {guard_model: wildguard, decode_text: true, decode_style: recover, reguard_original: true}

_harm: &harm {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, judge_method: wildguard, judge_model: wildguard, campaign: paper_c_reguard_ablation}
_ben:  &ben  {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, benchmark: orbench_benign_hard, judge_method: orbench, judge_model: qwen2_5_vl_7b, campaign: paper_c_reguard_ablation}

# attack renders (11) — identical to reguard_ablation.yaml
_set: &set outputs/autoattack_defense/prompt_transform/harmbench/set_theory_20260531_055707_10045511/llm_set_theory
