# ============================================================
# Paper C · Over-refusal MITIGATION pilot (Round-3 amplifier + real guard)  (2026-07-17)
# ============================================================
# The pilot showed modality_complete's DEFAULT guard (SAGE self-check on the
# target) over-refuses (65% benign). Hypothesis: the over-refusal is the SAGE
# self-check's fault, NOT the decode step. modality_complete's guard is a
# PARAMETER — swap in a TRAINED guard (wildguard) and:
#   (1) a trained classifier discriminates borderline-benign far better than an
#       ad-hoc SAGE prompt, AND
#   (2) on a SAFE verdict, mc[guard] re-queries the target with the ORIGINAL
#       prompt and returns its REAL answer (not a SAGE meta-analysis) -> benign
#       prompts get answered, not meta-refused.
# So mc[guard=wildguard] should keep ASR ~0 while dropping benign refusal well
# below the 65% of mc[SAGE].
#
# The comparison (reuses existing render dirs — NO re-render):
#   guard_baseline[wildguard] = wildguard on the RAW image input -> should MISS
#     (high ASR): the harm is in the image / decode-obscured.
#   mc[guard=wildguard]       = amplifier (recover+decode) THEN wildguard -> should
#     CATCH (low ASR) AND not over-refuse benign.
#   mc[SAGE self-check]       = the over-refusing default (guard_model unset).
#
# Judges (cheap-first): harmful -> wildguard; benign -> qwen refusal-judge.
# Servers: qwen (target + benign-judge) + wildguard (guard + harmful-judge) = 2
#   -> num_cluster_jobs = orchestrator + 2 = 3.
# PILOT slice [0,19]; scale to [0,99] + GuardReasoner-VL after the direction holds.
# ============================================================

num_main_job_threads: 4
num_cluster_jobs: 3

_wg: &wg wildguard

_harm: &harm
  mode: defense+evaluate
  target_model: qwen2_5_vl_7b
  prompt_range: [0, 19]
  judge_method: wildguard
  judge_model: wildguard
  campaign: paper_c_mitigation_pilot

_ben: &ben
  mode: defense+evaluate
  target_model: qwen2_5_vl_7b
  prompt_range: [0, 19]
  benchmark: orbench_benign_hard        # OR-Bench-Hard = the standard over-refusal benchmark
  judge_method: orbench                 # ORBench 3-class rubric (refuse/indirect/comply)
  judge_model: qwen2_5_vl_7b            # free pilot judge; gpt-5-mini rejudge for the final number
  campaign: paper_c_mitigation_pilot

# ── existing harmful ensemble render dirs (from mj_8412009 stage-1) ──
_figstep:  &figstep  outputs/autoattack_defense/prompt_transform/harmbench/ir_figstep_20260716_194159_70433849/ir_figstep
_fcflow:   &fcflow   outputs/autoattack_defense/prompt_transform/harmbench/ir_fc_flowchart_20260716_194159_69181110/ir_fc_flowchart
_lowcon:   &lowcon   outputs/autoattack_defense/prompt_transform/harmbench/ir_low_contrast_20260716_194159_9379140/ir_low_contrast
_occluded: &occluded outputs/autoattack_defense/prompt_transform/harmbench/ir_occluded_20260716_194159_10657917/ir_occluded
_mmtypo:   &mmtypo   outputs/autoattack_defense/prompt_transform/harmbench/ir_mm_typo_20260716_194203_32634422/ir_mm_typo
_distract: &distract outputs/autoattack_defense/prompt_transform/harmbench/ir_distraction_grid_20260716_194203_7625970/ir_distraction_grid
_camoimg:  &camoimg  outputs/autoattack_defense/prompt_transform/harmbench/semantic_camo_ir_plain_20260716_194205_29992788/ir_plain
# ── OR-Bench-Hard render dir (FILLED from orbench_render.yaml, job mj_8414208) ──
_ben_img:  &ben_img  outputs/autoattack_defense/prompt_transform/orbench_benign_hard/ir_plain_20260717_020703_54610685/ir_plain

tasks:
  # ── HARMFUL: amplifier+wildguard (catch?) + guard-alone (lift baseline) per attack ──
  - {<<: *harm, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true}, source_transform_subdir: *figstep}
  - {<<: *harm, defense: guard_baseline,    defense_config: {guard_model: *wg},                    source_transform_subdir: *figstep}
  - {<<: *harm, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true}, source_transform_subdir: *fcflow}
  - {<<: *harm, defense: guard_baseline,    defense_config: {guard_model: *wg},                    source_transform_subdir: *fcflow}
  - {<<: *harm, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true}, source_transform_subdir: *lowcon}
  - {<<: *harm, defense: guard_baseline,    defense_config: {guard_model: *wg},                    source_transform_subdir: *lowcon}
  - {<<: *harm, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true}, source_transform_subdir: *occluded}
  - {<<: *harm, defense: guard_baseline,    defense_config: {guard_model: *wg},                    source_transform_subdir: *occluded}
  - {<<: *harm, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true}, source_transform_subdir: *mmtypo}
  - {<<: *harm, defense: guard_baseline,    defense_config: {guard_model: *wg},                    source_transform_subdir: *mmtypo}
  - {<<: *harm, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true}, source_transform_subdir: *distract}
  - {<<: *harm, defense: guard_baseline,    defense_config: {guard_model: *wg},                    source_transform_subdir: *distract}
  - {<<: *harm, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true}, source_transform_subdir: *camoimg}
  - {<<: *harm, defense: guard_baseline,    defense_config: {guard_model: *wg},                    source_transform_subdir: *camoimg}

  # ── BENIGN: the over-refusal mitigation test (no_defense floor, SAGE-default, wildguard-guard) ──
  - {<<: *ben, defense: no_defense,                                                                     source_transform_subdir: *ben_img}
  - {<<: *ben, defense: modality_complete,                                                              source_transform_subdir: *ben_img}
  - {<<: *ben, defense: modality_complete, defense_config: {guard_model: *wg, decode_text: true},        source_transform_subdir: *ben_img}
