# ============================================================
# Paper C · COMPREHENSIVE pilot — surface-gated amplifier vs the FULL mixed
# ensemble (5 text-encoding + 6 established image attacks)  (2026-07-17)
# ============================================================
# The ensemble is mixed: part multimodal -> the whole is a multimodal-attack
# ensemble. TEXT ENCODING attacks (cipher, set_theory, formal_logic,
# classical_chinese, code_attack) are the decode-gap core -- the payload is still
# encoded even as plain text, so a guard that doesn't DECODE misses it. IMAGE
# attacks (the 6 established renders) need RECOVER. semantic_camo/quantum dropped
# (homemade, not established).
#
# Defense = surface-gated amplifier: mc[gate_decode, gate_style=surface]. The gate
# is a GENERAL non-natural-language detector (foreign/rare script, symbolic/math
# notation, ciphertext/base64 blobs, source code) -- NOT per-attack rules -- so
# it decodes ENCODED inputs (text or recovered-image) and skips PLAIN inputs
# (benign prompts AND plainly-transcribed image attacks), holding benign refusal
# at the raw-guard floor. Deterministic, no LLM call.
#
# Comparisons (reuses existing render dirs -- NO re-render):
#   - mc[surface_gate]  = the proposed defense. Should CATCH every attack.
#   - guard_baseline[wildguard] = guard on the RAW input. Should MISS (the gap):
#       text -> guard can't read the encoding; image -> text guard can't see the
#       image harm. mc's lift over this = the amplifier's contribution.
#   - BENIGN: no_defense (floor) / guard_baseline (isolation) / mc[surface_gate]
#       (target: ~floor, over-refusal solved) / mc[full-decode] (the over-refuser
#       reference, ~70%).
#
# Judges (cheap-first): harmful -> wildguard; OR-Bench -> qwen (ORBench 3-class).
# gpt-5-mini rejudge over saved responses for the final numbers.
# Servers: qwen (target + orbench-judge) + wildguard (guard + harm-judge) = 2
#   -> num_cluster_jobs = orchestrator + 2 = 3. No API in-run.
# PILOT slice [0,19]; scale after the direction holds.
# ============================================================

num_main_job_threads: 4
num_cluster_jobs: 3

_wg: &wg wildguard
_sg:   &sg   {guard_model: wildguard, decode_text: true, decode_style: recover, gate_decode: true, gate_style: surface}
_full: &full {guard_model: wildguard, decode_text: true, decode_style: recover}

_harm: &harm {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0, 19], judge_method: wildguard, judge_model: wildguard, campaign: paper_c_ensemble_full}
_ben:  &ben  {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0, 19], benchmark: orbench_benign_hard, judge_method: orbench, judge_model: qwen2_5_vl_7b, campaign: paper_c_ensemble_full}

# ── TEXT encoding attacks (text-channel delivery) ──
_set:    &set    outputs/autoattack_defense/prompt_transform/harmbench/set_theory_20260717_121526_20614086/llm_set_theory
_flog:   &flog   outputs/autoattack_defense/prompt_transform/harmbench/formal_logic_20260531_055707_75502107/llm_formal_logic
_class:  &class  outputs/autoattack_defense/prompt_transform/harmbench/classical_chinese_simplified_20260717_121526_53374039/llm_classical_language
_cipher: &cipher outputs/autoattack_defense/prompt_transform/harmbench/cipher_20260717_121526_49330419/non_llm_cipher
_code:   &code   outputs/autoattack_defense/prompt_transform/harmbench/code_attack_20260531_055707_73740181/code_attack
# ── IMAGE established attacks (from mj_8412009) ──
_figstep:  &figstep  outputs/autoattack_defense/prompt_transform/harmbench/ir_figstep_20260716_194159_70433849/ir_figstep
_fcflow:   &fcflow   outputs/autoattack_defense/prompt_transform/harmbench/ir_fc_flowchart_20260716_194159_69181110/ir_fc_flowchart
_lowcon:   &lowcon   outputs/autoattack_defense/prompt_transform/harmbench/ir_low_contrast_20260716_194159_9379140/ir_low_contrast
_occluded: &occluded outputs/autoattack_defense/prompt_transform/harmbench/ir_occluded_20260716_194159_10657917/ir_occluded
_mmtypo:   &mmtypo   outputs/autoattack_defense/prompt_transform/harmbench/ir_mm_typo_20260716_194203_32634422/ir_mm_typo
_distract: &distract outputs/autoattack_defense/prompt_transform/harmbench/ir_distraction_grid_20260716_194203_7625970/ir_distraction_grid
# ── OR-Bench-Hard benign (from mj_8414208) ──
_orb:      &orb      outputs/autoattack_defense/prompt_transform/orbench_benign_hard/ir_plain_20260717_020703_54610685/ir_plain

tasks:
  # ── TEXT encoding: surface-gated amplifier vs guard-alone ──
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *set}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *set}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *flog}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *flog}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *class}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *class}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *cipher}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *cipher}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *code}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *code}

  # ── IMAGE established: surface-gated amplifier vs guard-alone ──
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *figstep}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *figstep}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *fcflow}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *fcflow}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *lowcon}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *lowcon}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *occluded}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *occluded}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *mmtypo}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *mmtypo}
  - {<<: *harm, defense: modality_complete, defense_config: *sg, source_transform_subdir: *distract}
  - {<<: *harm, defense: guard_baseline, defense_config: {guard_model: *wg}, source_transform_subdir: *distract}

  # ── BENIGN over-refusal: floor / isolation / surface-gate / full-decode ──
  - {<<: *ben, defense: no_defense,                                            source_transform_subdir: *orb}
  - {<<: *ben, defense: guard_baseline,    defense_config: {guard_model: *wg}, source_transform_subdir: *orb}
  - {<<: *ben, defense: modality_complete, defense_config: *sg,               source_transform_subdir: *orb}
  - {<<: *ben, defense: modality_complete, defense_config: *full,             source_transform_subdir: *orb}
