# GuardReasoner-VL half of the AND-composition run, split to NURC (2026-07-28).
# The AICR run (job 229654) completed all 11 WildGuard cells, then deadlocked:
# its GuardReasoner server sat PENDING for 2h while the blocked guard calls held
# every task slot, starving even the WildGuard benign cells. This preset carries
# ONLY the GuardReasoner cells so they can run in parallel on NURC.
#
# Identical to reguard_and.yaml's guardreasoner rows, byte-for-byte -- the cell
# list is FILTERED from that file, not retyped, so source dirs and defense_config
# match by construction. See reguard_and.yaml for why one AND run yields both
# compositions (AND blocks a strict subset of OR, so OR reduces post-hoc).
num_main_job_threads: 6
num_cluster_jobs: 3   # orchestrator + target + 1 guard
