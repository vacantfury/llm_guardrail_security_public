# ============================================================
# Paper C · no_defense FLOOR @ n=100 — fills the DATA_NEEDED floor row of the
# 5-guard panel harmful table (experiment_results.md §5-Guard Panel).
# no_defense on the SAME 11 attack renders the panel's gb/mc consumed; target
# qwen2_5_vl_7b, HarmBench, n=100. In-run judge = wildguard (THROWAWAY, free);
# gpt-5-mini REJUDGE the saved responses afterward — the sole API step, matching
# the panel's headline judge (build_rejudge_preset.py --campaigns paper_c_guard_panel_floor).
# SERVERS: qwen (target) + wildguard (judge) = 2  ->  num_cluster_jobs = 3.
# CLUSTER: AICR (NURC busy with Paper D's Pixtral rerun). campaign: paper_c_guard_panel_floor
# ============================================================

num_main_job_threads: 3
num_cluster_jobs: 3

_rng: &rng [0, 99]

# no_defense floor cell — in-run judge wildguard is throwaway (gpt-5-mini rejudge later)
