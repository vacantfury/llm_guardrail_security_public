# ============================================================
# Paper C · Stage 1 — RE-RENDER the guard_panel.yaml gap to n=100  (2026-07-18)
# ============================================================
# The 4 TEXT encoders (set_theory / formal_logic / classical / code) already have
# n=100 renders. This fills the REST of guard_panel.yaml's 11 attacks + 2 benign
# channels to n=100 — the 6 image attacks + cipher + OR-Bench benign (image +
# text), which existed only at n=20. It is ensemble_render.yaml + orbench_render.yaml
# bumped from [0,19] to [0,99] (those presets' own note: "-> [0,99] for the full
# run"). Stage 1 ONLY — no target queries, no judging.
#
# COST / SERVERS:
#   - 4 image renders (figstep/fc_flowchart/low_contrast/occluded) + cipher +
#     both benign are NON-LLM -> FREE, CPU-only.
#   - ir_mm_typo + ir_distraction_grid call an aux CONSTRUCTION LLM
#     (gpt-4.1-mini, API — conf/imaging/{mm_typo,distraction_grid}.yaml) for
#     key-phrase extraction / decomposition: ~100 calls each, ≈ $1-2 total.
#     ⚠️ API MODEL — flagged for the API gate. Kept as gpt-4.1-mini to match the
#     existing n=20 renders + the published MM-SafetyBench / CS-DJ construction.
#   - No vLLM servers -> num_cluster_jobs = 1 (orchestrator only). Runs on AICR's
#     cpu partition; API keys injected by the sbatch wrapper at launch.
#
# AFTER this runs: re-point guard_panel.yaml's 8 image/cipher/benign anchors to
# the NEW n=100 render dirs, then flip guard_panel's _rng to [0,99].
# ============================================================

num_main_job_threads: 4
num_cluster_jobs: 1

_hb:  &hb  data/harmbench_prompts.jsonl
_orb: &orb data/orbench_benign_hard_prompts.jsonl
_rng: &rng [0, 99]

tasks:
  # ── 6 IMAGE attacks (HarmBench), n=100 ──
  - {mode: prompt_transform, source_file: *hb, prompt_range: *rng, transformation_list: [{type: ir_figstep,     params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: *hb, prompt_range: *rng, transformation_list: [{type: ir_fc_flowchart, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: *hb, prompt_range: *rng, transformation_list: [{type: ir_low_contrast, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: *hb, prompt_range: *rng, transformation_list: [{type: ir_occluded,     params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: *hb, prompt_range: *rng, transformation_list: [{type: ir_mm_typo}]}          # aux-LLM gpt-4.1-mini
  - {mode: prompt_transform, source_file: *hb, prompt_range: *rng, transformation_list: [{type: ir_distraction_grid}]} # aux-LLM gpt-4.1-mini

  # ── cipher (HarmBench, non-LLM base64 default), n=100 ──
  - {mode: prompt_transform, source_file: *hb, prompt_range: *rng, transformation_list: [{type: non_llm_cipher}]}

  # ── OR-Bench-Hard benign: image + text, n=100 ──
  - {mode: prompt_transform, source_file: *orb, prompt_range: *rng, benchmark: orbench_benign_hard, transformation_list: [{type: ir_plain, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: *orb, prompt_range: *rng, benchmark: orbench_benign_hard, transformation_list: [{type: non_llm_baseline}]}
