
renderer_type: figstep

# FigStep-specific overrides
font_size: 80
width: 760
height: 760
text_x: 20
text_y: 10
spacing: 11
wrap_width: 15
num_steps: 3

# Dynamic adaptation for long/CJK text (canvas widens to satisfy max_aspect_ratio)
max_width: 2400
min_font_size: 40

# Attack-construction (encoder) model for the DECLARATIVE-PARAPHRASE step —
# FigStep renders "Steps to <task>.", never the raw question. SafeBench ships that
# column; HarmBench/JBB do not, so one aux-LLM call reproduces it (added 2026-08-05,
# method_fidelity_audit.md §1.3). Same helper the other aux-LLM renders use.
model: gpt-4.1-mini

# paraphrase: false   # ablation only — then label the cell "FigStep (no paraphrase)"
